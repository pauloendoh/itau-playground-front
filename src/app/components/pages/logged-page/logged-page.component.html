<app-theme-switcher />

<mat-card class="user-card">
  <mat-card-header>
    <mat-card-title>Welcome, {{ authStore.user()?.username }}!</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="user-info">
      <div class="info-row">
        <span class="label">User ID:</span>
        <span class="value">{{ authStore.user()?.id }}</span>
      </div>
      <div class="info-row">
        <span class="label">Username:</span>
        <span class="value">{{ authStore.user()?.username }}</span>
      </div>
      <div class="info-row">
        <span class="label">Email:</span>
        <span class="value">{{ authStore.user()?.email }}</span>
      </div>
      <div class="info-row">
        <span class="label">Created At:</span>
        <span class="value">{{ authStore.user()?.createdAt }}</span>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="warn" (click)="onLogout()">Logout</button>
  </mat-card-actions>
</mat-card>
