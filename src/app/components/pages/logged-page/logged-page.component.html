<app-nova-solicitacao-button />

<table mat-table [dataSource]="formularios">
  <ng-container matColumnDef="codFormulario">
    <th mat-header-cell *matHeaderCellDef>Nº Solicitação</th>
    <td mat-cell *matCellDef="let row">{{ typedRow(row).codFormulario }}</td>
  </ng-container>

  <ng-container matColumnDef="tipoFormulario">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let row">{{ typedRow(row).tipoFormulario }}</td>
  </ng-container>

  <ng-container matColumnDef="situacaoFormulario">
    <th mat-header-cell *matHeaderCellDef>Situação</th>
    <td mat-cell *matCellDef="let row">
      {{ typedRow(row).situacaoFormulario }}
    </td>
  </ng-container>

  <ng-container matColumnDef="codigoCar">
    <th mat-header-cell *matHeaderCellDef>CAR</th>
    <td mat-cell *matCellDef="let row">{{ typedRow(row).codigoCar ?? "-" }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
