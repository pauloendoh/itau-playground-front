<table mat-table [dataSource]="dataSource()">
  @for (columnDef of columnDefs(); track columnDef.columnId) {
  <ng-container [matColumnDef]="_ToString(columnDef.columnId)">
    <th mat-header-cell *matHeaderCellDef>{{ columnDef.headerLabel }}</th>
    <td mat-cell *matCellDef="let item">
      @if (!!columnDef.cellText) { {{ columnDef.cellText(item) }} } @else {
      <ng-container
        [ngComponentOutlet]="columnDef.cellComponent.component"
        [ngComponentOutletInputs]="columnDef.cellComponent.componentInputs(item)"
      ></ng-container>
      }
    </td>
  </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
  <tr mat-row *matRowDef="let item; columns: displayedColumns()"></tr>
</table>
